<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Checkbox Dropdown</title>
</head>
<body>
	<details>
		<summary>Select options</summary>

		<label>
			<input type="checkbox" name="options" value="option-1">
			Option 1
		</label>
		<br>
		<label>
			<input type="checkbox" name="options" value="option-2">
			Option 2
		</label>
		<br>
		<label>
			<input type="checkbox" name="options" value="option-3">
			Option 3
		</label>
	</details>
</body>
</html>
